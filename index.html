<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة زايد للترجمة الذكية - MAHMOUD AI V12.0</title>
    <link href="https://fonts.googleapis.com/css2 family=Cairo:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f0ff;
            --dark-bg: #05060b;
            --panel-bg: rgba(9, 12, 22, 0.9);
            --border-glow: rgba(0, 255, 65, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.04) 0%, transparent 85%),
                linear-gradient(rgba(18, 16, 16, 0.25) 50%, rgba(0, 0, 0, 0.6) 50%);
            background-size: 100% 100%, 100% 4px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        /* الهيدر القيادي الفخم */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            border: 1px solid rgba(0, 240, 255, 0.25);
            background: var(--panel-bg);
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
        }

        .leaders-portraits {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* إطارات الصور المخصصة للـ شيوخ الكرام */
        .avatar-frame {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 12px var(--neon-green);
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }

        .platform-title h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to left, #ffffff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .platform-title p {
            font-family: 'Orbitron';
            font-size: 10px;
            color: var(--neon-green);
            letter-spacing: 2px;
        }

        /* شعار رؤية 2030 المتطور */
        .vision-2030-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--neon-blue);
            padding: 6px 16px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .vision-text {
            text-align: center;
        }

        .vision-text .title {
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .vision-text .sub {
            font-size: 10px;
            opacity: 0.8;
            font-weight: 700;
        }

        .flags-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .flag {
            font-size: 22px;
        }

        .engine-tag {
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 11px;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 5px 12px;
            border-radius: 5px;
            background: rgba(0, 255, 65, 0.03);
        }

        /* تقسيم شاشات العرض والتحكم (كاميرا كبرى من جهة، ومخرجات ذكية من جهة) */
        .core-dashboard {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 15px;
            flex: 1;
            height: calc(100vh - 120px);
        }

        /* قسم الكاميرا الكبرى الحرة لتتبع فائق الحركية */
        .camera-viewport {
            background: #000;
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 16px;
            position: relative;
            height: 450px; /* تم تكبير الشاشة بشكل كبير جداً كما طلبتم */
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
        }

        #webcam, #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output_canvas { z-index: 2; }

        .laser-scanner {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 12px var(--neon-blue);
            top: 0;
            animation: scan 4s linear infinite;
            z-index: 3;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* اللوحة الجانبية للمخرجات وسجل الحركات */
        .side-outputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-shadow: inset 0 0 30px rgba(0, 255, 65, 0.05);
        }

        .panel-hud-text {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 10px;
            color: var(--neon-blue);
            font-family: 'Orbitron';
            letter-spacing: 1px;
        }

        #translationValue {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px var(--neon-green);
            text-align: center;
        }

        .matrix-badge {
            margin-top: 15px;
            font-family: 'Orbitron';
            font-size: 12px;
            color: rgba(0, 240, 255, 0.8);
            background: rgba(0, 240, 255, 0.06);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .logs-panel {
            height: 180px;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .logs-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--neon-blue);
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        #logs {
            flex: 1;
            overflow-y: auto;
        }

        .log-item {
            font-size: 12px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 5px;
            border-radius: 4px;
            border-right: 2px solid var(--neon-green);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <header>
        <div class="leaders-portraits">
            <img class="avatar-frame" src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Sheikh_Zayed_bin_Sultan_Al_Nahyan.jpg" alt="الشيخ زايد">
            
            <div class="avatar-frame" style="border-color: var(--neon-blue); box-shadow: 0 0 12px var(--neon-blue); font-size:10px;">صورة الشيخ محمد</div>
            
            <div class="platform-title">
                <h1>منصة زايد للترجمة الذكية</h1>
                <p>ZAYED INTELLIGENT VISION SYSTEM</p>
            </div>
        </div>

        <div class="vision-2030-container">
            <div class="vision-text">
                <div class="title">VISION 2030</div>
                <div class="sub">رؤية الإمارات للمستقبل الرقمي</div>
            </div>
        </div>

        <div class="flags-badge">
            <span class="flag">🇦🇪</span>
            <span style="color: rgba(255,255,255,0.2);">|</span>
            <span class="flag">🇪🇬</span>
        </div>

        <div class="engine-tag">MAHMOUD AI V12.0</div>
    </header>

    <div class="core-dashboard">
        
        <div class="camera-viewport">
            <div class="laser-scanner"></div>
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div class="side-outputs">
            
            <div class="result-panel">
                <div class="panel-hud-text">MAHMOUD AI ENGINE REALTIME DECODER</div>
                <div id="translationValue">في انتظار تشغيل الكاميرا...</div>
                <div class="matrix-badge" id="matrixCode">MATRIX: 00000</div>
            </div>

            <div class="logs-panel">
                <div class="logs-header"><span>سجل الحركات المعتمدة</span><span>LIVE_LOGS</span></div>
                <div id="logs"></div>
            </div>

        </div>

    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const translationValue = document.getElementById('translationValue');
        const matrixCodeDisplay = document.getElementById('matrixCode');
        const logsContainer = document.getElementById('logs');
        
        let currentRawPrediction = "";
        let confirmedPrediction = "في انتظار الإشارة...";
        let gestureTimer = null;
        const STABILIZATION_DELAY = 300; 

        videoElement.addEventListener('loadedmetadata', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        });

        function pushLog(text) {
            if (text === "في انتظار الإشارة..." || text.includes("...")) return;
            if (logsContainer.firstChild && logsContainer.firstChild.firstChild.innerText === text) return;

            const entry = document.createElement('div');
            entry.className = 'log-item';
            const timestamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span>${text}</span> <span style="opacity:0.4; font-family:Orbitron;">${timestamp}</span>`;
            logsContainer.prepend(entry);
            if (logsContainer.children.length > 5) logsContainer.removeChild(logsContainer.lastChild);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // قاموس المحرك مصفوفات هيكلية لـ +100 حركة محتملة
        const MAHMOUD_AI_DICTIONARY = {
            "10001": "اتصل بي 🤙",
            "01001": "أحبك (بلغة الإشارة) 🤟",
            "10000": "ممتاز / موافق 👍",
            "00111": "أحسنت / تمت العملية 👌",
            "11111": "مرحباً / كف مفتوح / سلام 👋",
            "00000": "قبضة يد / الرقم 0 ✊",
            "11000": "إشارة توجيه / اتجاه 👉",
            "10111": "شكراً لك 🙏",
            
            // الأرقام المتكاملة
            "01000": "الرقم 1 / حرف الألف ☝️",
            "01100": "الرقم 2 / علامة النصر ✌️",
            "01110": "الرقم 3 🤟",
            "01111": "الرقم 4 / حرف الباء ✋",
            "20000": "الرقم 6 ٦",
            "21000": "الرقم 7 ٧",
            "21100": "الرقم 8 ٨",
            "21110": "الرقم 9 ٩",
            "21111": "الرقم 10 🔟",

            // فصائل الحروف
            "01002": "حرف التاء الأبجدي",
            "01102": "حرف الثاء الأبجدي",
            "02222": "حرف الجيم / كف ملتف ✊",
            "01112": "حرف الحاء لغة الإشارة",
            "11100": "حرف الخاء عالي الدقة",
            "00110": "حرف الدال د",
            "22000": "حرف الصاد ص",
            "22200": "حرف الضاد ض"
        };

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            let detectedGesture = "في انتظار الإشارة...";
            let currentMatrixKey = "00000";

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(landmarks);

                landmarks.forEach(point => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 3.5, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = "#00f0ff";
                    canvasCtx.fill();
                });

                const checkFingerState = (tip, pip, mcp) => {
                    if (landmarks[tip].y < landmarks[pip].y && landmarks[pip].y < landmarks[mcp].y) {
                        return 1; 
                    } else if (landmarks[tip].y > landmarks[pip].y) {
                        return 0; 
                    } else {
                        return 2; 
                    }
                };

                const thumbOpen = getDistance(landmarks[4], landmarks[17]) > getDistance(landmarks[3], landmarks[17]) ? 1 : 0;
                const indexState = checkFingerState(8, 6, 5);
                const middleState = checkFingerState(12, 10, 9);
                const ringState = checkFingerState(16, 14, 13);
                const pinkyState = checkFingerState(20, 18, 17);

                currentMatrixKey = `${thumbOpen}${indexState}${middleState}${ringState}${pinkyState}`;
                matrixCodeDisplay.innerText = `MATRIX: ${currentMatrixKey}`;

                if (MAHMOUD_AI_DICTIONARY[currentMatrixKey]) {
                    detectedGesture = MAHMOUD_AI_DICTIONARY[currentMatrixKey];
                } else {
                    let openedCount = [thumbOpen, indexState, middleState, ringState, pinkyState].filter(x => x === 1).length;
                    
                    if (thumbOpen === 1 && openedCount === 1) {
                        detectedGesture = landmarks[4].y < landmarks[3].y ? "ممتاز / موافق 👍" : "سيء / غير موافق 👎";
                    } else if (getDistance(landmarks[4], landmarks[8]) < 0.04 && middleState === 1 && ringState === 1) {
                        detectedGesture = "أحسنت / تمت العملية 👌";
                    } else {
                        detectedGesture = `مصفوفة مرنة غير مسجلة (${currentMatrixKey})`;
                    }
                }
            } else {
                matrixCodeDisplay.innerText = `MATRIX: 00000`;
            }

            if (detectedGesture !== currentRawPrediction) {
                currentRawPrediction = detectedGesture;
                clearTimeout(gestureTimer);
                
                gestureTimer = setTimeout(() => {
                    confirmedPrediction = currentRawPrediction;
                    translationValue.innerText = confirmedPrediction;
                    pushLog(confirmedPrediction);
                }, STABILIZATION_DELAY);
            }
            
            if (detectedGesture === "في انتظار الإشارة...") {
                clearTimeout(gestureTimer);
                confirmedPrediction = "في انتظار الإشارة...";
                translationValue.innerText = confirmedPrediction;
            }
        }

        function drawConnectors(landmarks) {
            const connections = [
                [0,1], [1,2], [2,3], [3,4], [0,5], [5,6], [6,7], [7,8],
                [5,9], [9,10], [10,11], [11,12], [9,13], [13,14], [14,15], [15,16],
                [0,17], [17,18], [18,19], [19,20], [13,17]
            ];
            canvasCtx.strokeStyle = "rgba(0, 255, 65, 0.4)";
            canvasCtx.lineWidth = 2.8;
            connections.forEach(([start, end]) => {
                canvasCtx.beginPath();
                canvasCtx.moveTo(landmarks[start].x * canvasElement.width, landmarks[start].y * canvasElement.height);
                canvasCtx.lineTo(landmarks[end].x * canvasElement.width, landmarks[end].y * canvasElement.height);
                canvasCtx.stroke();
            });
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.65, minTrackingConfidence: 0.65 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 1280, height: 720
        });
        camera.start().then(() => { translationValue.innerText = "في انتظار الإشارة..."; });
    </script>
</body>
</html>
