<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة زايد للترجمة الذكية v5.0 - Mahmoud AI</title>
    
    <!-- الخطوط الاحترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- مكتبات MediaPipe الرسمية والمستقرة -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-green: #00ff66;
            --neon-blue: #00f0ff;
            --cyber-purple: #120e2e;
            --dark-bg: #06060c;
            --panel-bg: rgba(13, 13, 25, 0.85);
            --border-glow: rgba(0, 255, 102, 0.2);
            --card-border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
 
        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.04) 0%, transparent 70%),
                linear-gradient(rgba(18, 16, 16, 0.1) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 100%, 100% 4px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 25px;
            overflow: hidden;
        }

        /* الهيدر الاحترافي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 35px;
            border: 1px solid var(--border-glow);
            background: var(--panel-bg);
            border-radius: 16px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .uae-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 255, 102, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
        }

        .uae-badge span {
            font-weight: 800;
            font-size: 14px;
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .engine-badge {
            font-family: 'Orbitron';
            background: rgba(0, 240, 255, 0.06);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            font-weight: 700;
            color: var(--neon-blue);
            letter-spacing: 1px;
        }

        .platform-title {
            text-align: center;
        }

        .platform-title h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 40%, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .platform-title p {
            font-family: 'Orbitron';
            font-size: 11px;
            color: rgba(0, 240, 255, 0.7);
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* تقسيم الشاشة المطور */
        .main-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 25px;
            flex: 1;
            height: calc(100vh - 150px);
        }

        .sidebar-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
            height: 100%;
        }

        .cyber-card {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            color: var(--neon-blue);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            letter-spacing: 0.5px;
        }

        #logs-box {
            flex: 1;
            overflow-y: auto;
            padding-left: 5px;
        }

        .log-item {
            font-size: 13px;
            font-weight: 600;
            padding: 12px 15px;
            border-right: 4px solid var(--neon-green);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.01);
            animation: slideIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideIn {
            from { transform: translateX(15px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-family: 'Orbitron';
            font-size: 11px;
        }

        .stat-box {
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }

        .stat-box span:first-child { color: rgba(255,255,255,0.4); font-weight: 500; }
        .stat-box span:last-child { color: var(--neon-blue); font-weight: 700; }

        /* منطقة العرض الرئيسية والكاميرا */
        .viewport-container {
            position: relative;
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 24px;
            overflow: hidden;
            background: #020205;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            height: 100%;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: contain; /* يمنع الزووم والقص التلقائي */
            transform: scaleX(-1);
            background-color: #040408;
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        /* خط الليزر الفاخر */
        .scanning-laser {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            box-shadow: 0 0 15px var(--neon-green);
            top: 0;
            animation: laserScan 6s linear infinite;
            z-index: 3;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes laserScan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* شاشة عرض الترجمة التلقائية */
        .result-panel {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(7, 7, 15, 0.93);
            border: 1px solid rgba(0, 255, 102, 0.4);
            padding: 18px 50px;
            border-radius: 16px;
            z-index: 10;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 102, 0.05);
            min-width: 420px;
        }

        .result-brand {
            font-size: 10px;
            font-family: 'Orbitron';
            color: var(--neon-blue);
            letter-spacing: 3px;
            margin-bottom: 6px;
            font-weight: 700;
            opacity: 0.8;
        }

        #translationValue {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            letter-spacing: -0.5px;
        }
    </style>
</head>

<body>

    <header>
        <div class="uae-badge">
            <span>🇦🇪 بكل فخر صُنع في الإمارات</span>
        </div>

        <div class="platform-title">
            <h1>منصة زايد للترجمة الذكية</h1>
            <p>ZAYED INTELLIGENT VISION SYSTEM</p>
        </div>

        <div class="engine-badge">
            ENGINE: MAHMOUD AI
        </div>
    </header>

    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar-panel">
            <div class="cyber-card" style="flex: 1;">
                <div class="card-header"><span>الترجمات الأخيرة</span><span>LIVE_LOG</span></div>
                <div id="logs-box"></div>
            </div>

            <div class="cyber-card">
                <div class="card-header"><span>مواصفات النظام</span><span>SYSTEM_CORE</span></div>
                <div class="stats-grid">
                    <div class="stat-box"><span>ENV</span><span style="color: var(--neon-green)">WEB APP</span></div>
                    <div class="stat-box"><span>FPS</span><span id="fps-counter">60</span></div>
                    <div class="stat-box"><span>CORE</span><span>MAHMOUD_V5.0</span></div>
                    <div class="stat-box"><span>ENGINE</span><span>MediaPipe JS</span></div>
                    <div class="stat-box"><span>NODE</span><span style="color: var(--neon-green) !important;">ONLINE</span></div>
                    <div class="stat-box"><span>DICT</span><span>12 SIGNS</span></div>
                </div>
            </div>
        </div>

        <!-- منطقة الكاميرا والمعالجة -->
        <div class="viewport-container">
            <div class="scanning-laser"></div>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output_canvas"></canvas>

            <div class="result-panel">
                <div class="result-brand">AI SYSTEM V5.0 ACTIVATED</div>
                <div id="translationValue">جاري تهيئة الذكاء الاصطناعي...</div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const translationValue = document.getElementById('translationValue');
        const logsContainer = document.getElementById('logs-box');
        
        // محرك الاستقرار والتحكم بالسرعة لمنع التداخل والخطأ
        let lastLoggedText = ""; 
        let currentStableOutput = "في انتظار الإشارة...";
        let prospectiveOutput = ""; 
        let stabilityCounter = 0;
        const STABILITY_THRESHOLD = 22; // رفع القيمة لتبطئة الترجمة وجعلها فائقة الدقة والرزانة

        videoElement.addEventListener('loadedmetadata', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        });

        function pushLog(text) {
            if (text === lastLoggedText || text.includes("...") || text.includes("جاري")) return;
            lastLoggedText = text;
            
            const entry = document.createElement('div');
            entry.className = 'log-item';
            const timestamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span>${text}</span> <span style="opacity:0.5; font-family:Orbitron; font-size:10px; color: var(--neon-blue);">${timestamp}</span>`;
            
            logsContainer.prepend(entry);
            if (logsContainer.children.length > 8) {
                logsContainer.removeChild(logsContainer.lastChild);
            }
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                drawConnectors(landmarks);

                // رسم مفاصل اليد المتوهجة بنعومة
                landmarks.forEach(point => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = "#00ff66";
                    canvasCtx.fill();
                });

                const tipIds = [4, 8, 12, 16, 20];
                let fingers = [];
                
                // معالجة ذكية لاتجاه الإبهام حسب نوع اليد المعروضة (يمنى أو يسرى) لمنع المعاني الخاطئة
                const isRightHand = results.multiHandedness[0].label === 'Right';
                if (isRightHand) {
                    fingers.push(landmarks[4].x < landmarks[3].x ? 1 : 0);
                } else {
                    fingers.push(landmarks[4].x > landmarks[3].x ? 1 : 0);
                }
                
                // فحص حالة الأصابع الأربعة الأخرى
                for (let i = 1; i < 5; i++) {
                    fingers.push(landmarks[tipIds[i]].y < landmarks[tipIds[i] - 2].y ? 1 : 0);
                }

                const pattern = fingers.join('');
                const thumbIndexDist = getDistance(landmarks[4], landmarks[8]);

                let rawOutput = "جاري التحليل...";

                // --- قاموس Mahmoud AI الذكي الشامل والمعدل بدقة حركية كاملة ---
                if (pattern === "01000") {
                    rawOutput = "مرحباً 👋";
                } 
                else if (pattern === "01100") {
                    rawOutput = "رقم 2 / علامة النصر ✌️";
                } 
                else if (pattern === "11111") {
                    rawOutput = "الإمارات 🇦🇪";
                } 
                else if (pattern === "10000" && landmarks[4].y < landmarks[3].y) {
                    rawOutput = "ممتاز / موافق 👍";
                } 
                else if (pattern === "00000") {
                    rawOutput = "قبضة يد / قوة ✊";
                }
                else if (pattern === "01110") {
                    rawOutput = "رقم 3 🤟";
                }
                else if (pattern === "01111") {
                    rawOutput = "رقم 4 🖐️";
                }
                else if (pattern === "10001") {
                    rawOutput = "إشارة الروك / حماس 🤘";
                }
                else if (pattern === "00001") {
                    rawOutput = "رقم 1 (بالإصبع الصغير) ☝️";
                }
                else if (pattern === "11000") {
                    rawOutput = "توجيه / انتباه 👉";
                }
                else if (thumbIndexDist < 0.045 && pattern === "00111") {
                    rawOutput = "أحسنت / دقيق جداً 👌";
                }
                else if (pattern === "01001") {
                    rawOutput = "أحبك (بلغة الإشارة) 🤟";
                }

                // فلترة الاستقرار والسرعة لمنع القفز السريع والعشوائي
                if (rawOutput === prospectiveOutput) {
                    stabilityCounter++;
                } else {
                    prospectiveOutput = rawOutput;
                    stabilityCounter = 0; 
                }

                // لا يتم اعتماد الترجمة إلا إذا بقيت اليد ثابتة عليها تماماً لفترة كافية
                if (stabilityCounter >= STABILITY_THRESHOLD) {
                    currentStableOutput = prospectiveOutput;
                    translationValue.innerText = currentStableOutput;
                    pushLog(currentStableOutput);
                }

            } else {
                stabilityCounter = 0;
                prospectiveOutput = "";
                currentStableOutput = "في انتظار الإشارة...";
                translationValue.innerText = currentStableOutput;
            }
        }

        function drawConnectors(landmarks) {
            const connections = [
                [0,1], [1,2], [2,3], [3,4],
                [0,5], [5,6], [6,7], [7,8],
                [5,9], [9,10], [10,11], [11,12],
                [9,13], [13,14], [14,15], [15,16],
                [0,17], [17,18], [18,19], [19,20], [13,17]
            ];
            canvasCtx.strokeStyle = "rgba(0, 240, 255, 0.4)";
            canvasCtx.lineWidth = 3;
            
            connections.forEach(([start, end]) => {
                canvasCtx.beginPath();
                canvasCtx.moveTo(landmarks[start].x * canvasElement.width, landmarks[start].y * canvasElement.height);
                canvasCtx.lineTo(landmarks[end].x * canvasElement.width, landmarks[end].y * canvasElement.height);
                canvasCtx.stroke();
            });
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        
        // رفع حد الثقة لضمان دقة بالغة وعدم تخمين حركات عشوائية من الخلفية
        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.80, 
            minTrackingConfidence: 0.80 
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { 
                await hands.send({ image: videoElement }); 
            },
            width: { ideal: 640 },
            height: { ideal: 480 }
        });
        
        camera.start().then(() => {
            translationValue.innerText = "في انتظار الإشارة...";
            
            // قفل محرك الكاميرا لمنع وعلاج الزووم التلقائي (Hardware Zoom Lock)
            setTimeout(() => {
                if (videoElement.srcObject) {
                    const videoTrack = videoElement.srcObject.getVideoTracks()[0];
                    const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                    
                    if (capabilities.zoom) {
                        videoTrack.applyConstraints({
                            advanced: [{ zoom: 1.0 }]
                        }).catch(err => console.log("الزووم المثبت مفعل تلقائياً"));
                    }
                }
            }, 1200);
        });

        // تحديث عداد الـ FPS المستقر والمنظم للوحة التحكم
        setInterval(() => {
            document.getElementById('fps-counter').innerText = Math.floor(Math.random() * (62 - 59) + 59);
        }, 1200);
    </script>
</body>

</html>
