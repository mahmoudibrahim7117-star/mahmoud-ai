<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة زايد الذكية v7.0 - القاموس الموسع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --neon-green: #00ff41;
            --neon-blue: #00f0ff;
            --dark-bg: #0a0a12;
            --panel-bg: rgba(15, 15, 25, 0.9);
            --border-glow: rgba(0, 255, 65, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
 
        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(18, 16, 16, 0.1) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 100%, 100% 4px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border: 1px solid var(--border-glow);
            background: var(--panel-bg);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
        }

        .uae-pride {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 255, 65, 0.05);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--neon-green);
            animation: pulse-border 2s infinite;
        }

        .uae-pride span {
            font-weight: 900;
            font-size: 14px;
            text-shadow: 0 0 10px var(--neon-green);
            color: var(--neon-green);
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 5px var(--border-glow); }
            50% { box-shadow: 0 0 20px var(--neon-green); }
            100% { box-shadow: 0 0 5px var(--border-glow); }
        }

        .platform-name {
            text-align: center;
        }

        .platform-name h1 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(to left, #fff, var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .platform-name p {
            font-family: 'Orbitron';
            font-size: 11px;
            color: var(--neon-blue);
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            flex: 1;
            height: calc(100vh - 140px);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .glass-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card-label {
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            color: var(--neon-blue);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        #logs {
            flex: 1;
            overflow-y: auto;
        }

        .log-entry {
            font-size: 14px;
            padding: 10px;
            border-right: 3px solid var(--neon-green);
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-family: 'Orbitron';
            font-size: 11px;
        }

        .spec-item {
            border: 1px solid rgba(0, 240, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
        }

        .spec-item span:first-child { opacity: 0.6; }
        .spec-item span:last-child { color: var(--neon-blue); }

        .viewport-wrapper {
            position: relative;
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            height: 100%;
        }

        #webcam, #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output_canvas { z-index: 2; }

        .laser-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            top: 0;
            animation: laser 4s linear infinite;
            z-index: 5;
        }

        @keyframes laser {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .ai-result-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(50%);
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid var(--neon-green);
            padding: 15px 60px;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            min-width: 380px;
        }

        #translationValue {
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 15px var(--neon-green);
        }
    </style>
</head>

<body>

    <header>
        <div class="uae-pride"><span>🇦🇪 بكل فخر صُنع في الإمارات</span></div>
        <div class="platform-name">
            <h1>منصة زايد للترجمة الذكية</h1>
            <p>ZAYED INTELLIGENT VISION SYSTEM</p>
        </div>
        <div class="uae-pride" style="border-color: var(--neon-blue); font-family: 'Orbitron';">
            <span style="color: var(--neon-blue);">ENGINE: MAHMOUD AI V7.0</span>
        </div>
    </header>

    <div class="main-grid">
        <div class="sidebar">
            <div class="glass-card" style="flex: 1;">
                <div class="card-label"><span>الترجمات المعتمدة</span><span>LIVE_LOG</span></div>
                <div id="logs"></div>
            </div>
            <div class="glass-card">
                <div class="card-label"><span>وحدة التحكم</span><span>SYSTEM_CORE</span></div>
                <div class="specs-grid">
                    <div class="spec-item"><span>DICTIONARY</span><span style="color: var(--neon-green)">20+ إشارة ذكية</span></div>
                    <div class="spec-item"><span>SMOOTHING</span><span>450ms STABLE</span></div>
                    <div class="spec-item"><span>ENGINE</span><span>MediaPipe JS</span></div>
                    <div class="spec-item"><span>STATUS</span><span style="color: var(--neon-green)">ONLINE</span></div>
                </div>
            </div>
        </div>

        <div class="viewport-wrapper">
            <div class="laser-line"></div>
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output_canvas"></canvas>

            <div class="ai-result-box">
                <div style="font-size: 11px; color: var(--neon-blue); letter-spacing: 2px; font-family: 'Orbitron';">LIVE TRANSLATION</div>
                <div id="translationValue">جاري تشغيل الكاميرا...</div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const translationValue = document.getElementById('translationValue');
        const logsContainer = document.getElementById('logs');
        
        let currentRawPrediction = "";
        let confirmedPrediction = "في انتظار الإشارة...";
        let gestureTimer = null;
        const STABILIZATION_DELAY = 450; 

        videoElement.addEventListener('loadedmetadata', () => {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
        });

        function pushLog(text) {
            if (text === "في انتظار الإشارة..." || text.includes("...")) return;
            if (logsContainer.firstChild && logsContainer.firstChild.firstChild.innerText === text) return;

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span>${text}</span> <span style="opacity:0.5; font-size:10px; font-family:Orbitron; color: var(--neon-blue);">${timestamp}</span>`;
            logsContainer.prepend(entry);
            if (logsContainer.children.length > 7) logsContainer.removeChild(logsContainer.lastChild);
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            let detectedGesture = "في انتظار الإشارة...";

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                drawConnectors(landmarks);

                landmarks.forEach(point => {
                    canvasCtx.beginPath();
                    canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = "#00ff41";
                    canvasCtx.fill();
                });

                const tipIds = [4, 8, 12, 16, 20];
                let fingers = [];
                
                // حسابات حالة الأصابع المتقدمة
                const thumbOpen = Math.abs(landmarks[4].x - landmarks[2].x) > 0.035 || landmarks[4].y < landmarks[3].y;
                const indexOpen = landmarks[8].y < landmarks[6].y;
                const middleOpen = landmarks[12].y < landmarks[10].y;
                const ringOpen = landmarks[16].y < landmarks[14].y;
                const pinkyOpen = landmarks[20].y < landmarks[18].y;
                
                fingers.push(thumbOpen ? 1 : 0);
                fingers.push(indexOpen ? 1 : 0);
                fingers.push(middleOpen ? 1 : 0);
                fingers.push(ringOpen ? 1 : 0);
                fingers.push(pinkyOpen ? 1 : 0);

                const pattern = fingers.join('');
                const thumbIndexDist = getDistance(landmarks[4], landmarks[8]);
                const indexMiddleDist = getDistance(landmarks[8], landmarks[12]);
                const thumbPinkyDist = getDistance(landmarks[4], landmarks[20]);

                // --- مصفوفة القاموس الموسع الذكي (20+ إشارة متطورة) ---
                
                // 1. الإشارات الحركية والتعبيرية
                if (pattern === "01000" && landmarks[8].y < landmarks[5].y) {
                    detectedGesture = "مرحباً 👋 / حرف الألف";
                }
                else if (pattern === "10001" && thumbOpen && pinkyOpen && !indexOpen) {
                    detectedGesture = "اتصل بي 🤙";
                }
                else if (pattern === "10000" && landmarks[4].y < landmarks[3].y) {
                    detectedGesture = "ممتاز / موافق 👍";
                }
                else if (pattern === "10000" && landmarks[4].y > landmarks[3].y) {
                    detectedGesture = "سيء / غير موافق 👎";
                }
                else if (thumbIndexDist < 0.03 && pattern === "00111") {
                    detectedGesture = "أحسنت / دقيق جداً 👌";
                }
                else if (pattern === "01001" && indexOpen && pinkyOpen) {
                    detectedGesture = "أحبك (بلغة الإشارة) 🤟";
                }
                else if ((pattern === "10001" || pattern === "01001") && indexOpen && !thumbOpen) {
                    detectedGesture = "إشارة الروك / حماس 🤘";
                }
                else if (pattern === "11000" && thumbOpen && indexOpen) {
                    detectedGesture = "إشارة توجيه / اتجاه 👉";
                }

                // 2. سلسلة الأرقام لغة الإشارة المتقدمة
                else if (pattern === "00000") {
                    detectedGesture = "قبضة يد / الرقم 0 ✊";
                }
                else if (pattern === "01000") {
                    detectedGesture = "الرقم 1 ☝️";
                }
                else if (pattern === "01100" && indexMiddleDist > 0.02) {
                    detectedGesture = "الرقم 2 / علامة النصر ✌️";
                }
                else if (pattern === "01110") {
                    detectedGesture = "الرقم 3 🤟";
                }
                else if (pattern === "01111") {
                    detectedGesture = "الرقم 4 / حرف الباء ✋";
                }
                else if (pattern === "11111") {
                    detectedGesture = "الرقم 5 / كف مفتوح 🖐️";
                }
                else if (pattern === "11000" && !indexOpen) {
                    detectedGesture = "الرقم 6 👌";
                }
                else if (pattern === "11100" && !middleOpen) {
                    detectedGesture = "الرقم 7 👇";
                }
                else if (pattern === "11110" && !ringOpen) {
                    detectedGesture = "الرقم 8 👆";
                }
                else if (pattern === "00111" && thumbIndexDist > 0.04) {
                    detectedGesture = "الرقم 9 🖐️";
                }
                else if (thumbIndexDist < 0.035 && pattern === "01111") {
                    detectedGesture = "الرقم 10 🔟";
                }
                
                // 3. تصنيف احتياطي ذكي لمنع توقف الشاشة
                else {
                    const totalFingers = fingers.reduce((a, b) => a + b, 0);
                    detectedGesture = `حركة مخصصة (${totalFingers} أصابع مرفوعة)`;
                }
            }

            // نظام الحماية والتهدئة الذكي
            if (detectedGesture !== currentRawPrediction) {
                currentRawPrediction = detectedGesture;
                clearTimeout(gestureTimer);
                
                gestureTimer = setTimeout(() => {
                    confirmedPrediction = currentRawPrediction;
                    translationValue.innerText = confirmedPrediction;
                    pushLog(confirmedPrediction);
                }, STABILIZATION_DELAY);
            }
            
            if (detectedGesture === "في انتظار الإشارة...") {
                clearTimeout(gestureTimer);
                confirmedPrediction = "في انتظار الإشارة...";
                translationValue.innerText = confirmedPrediction;
            }
        }

        function drawConnectors(landmarks) {
            const connections = [
                [0,1], [1,2], [2,3], [3,4], [0,5], [5,6], [6,7], [7,8],
                [5,9], [9,10], [10,11], [11,12], [9,13], [13,14], [14,15], [15,16],
                [0,17], [17,18], [18,19], [19,20], [13,17]
            ];
            canvasCtx.strokeStyle = "rgba(0, 240, 255, 0.5)";
            canvasCtx.lineWidth = 3;
            connections.forEach(([start, end]) => {
                canvasCtx.beginPath();
                canvasCtx.moveTo(landmarks[start].x * canvasElement.width, landmarks[start].y * canvasElement.height);
                canvasCtx.lineTo(landmarks[end].x * canvasElement.width, landmarks[end].y * canvasElement.height);
                canvasCtx.stroke();
            });
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 1280, height: 720
        });
        camera.start().then(() => { translationValue.innerText = "في انتظار الإشارة..."; });
    </script>
</body>
</html>
